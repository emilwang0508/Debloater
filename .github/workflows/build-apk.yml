name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'release/v*']
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Android version
        id: version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          read_version_name() {
            sed -nE 's/^[[:space:]]*versionName = "([^"]+)"[[:space:]]*$/\1/p'
          }
          read_version_code() {
            sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)[[:space:]]*$/\1/p'
          }
          config=app/build.gradle.kts
          version="$(read_version_name < "$config")"
          code="$(read_version_code < "$config")"
          stable='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          if [[ ! "$version" =~ ^${stable}(-preview\.[1-9][0-9]*)?$ || ! "$code" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error file=$config::Expected a valid versionName and positive versionCode"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/heads/main || "$GITHUB_BASE_REF" == main ]] && [[ ! "$version" =~ ^${stable}$ ]]; then
            echo "::error file=$config::main requires a stable versionName (X.Y.Z)"
            exit 1
          fi
          if [[ "$GITHUB_BASE_REF" == main && "$GITHUB_HEAD_REF" == release/v* ]]; then
            expected="${GITHUB_HEAD_REF#release/v}"
            base_code="$(git show "$BASE_SHA:$config" | read_version_code)"
            if [[ "$version" != "$expected" ]]; then
              echo "::error file=$config::Set versionName to $expected before merging $GITHUB_HEAD_REF"
              exit 1
            fi
            if [[ ! "$base_code" =~ ^[1-9][0-9]*$ ]] || (( code <= base_code )); then
              echo "::error file=$config::Increase versionCode above main ($base_code)"
              exit 1
            fi
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            if [[ "$GITHUB_REF" != "refs/tags/v$version" || ! "$version" =~ ^${stable}$ ]]; then
              echo "::error file=$config::Release tag must match the stable Gradle version (vX.Y.Z)"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::Release tags must point to a commit on main"
              exit 1
            fi
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Build and check the debug APK
        if: github.ref_type != 'tag'
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: Debloater-v${{ steps.version.outputs.name }}-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Build and check the release APK
        if: github.ref_type == 'tag'
        run: gradle --no-daemon assembleRelease lintRelease
      - name: Sign and verify the release APK
        if: github.ref_type == 'tag'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_BASE64" || -z "$RELEASE_KEYSTORE_PASSWORD" ||
                -z "$RELEASE_KEY_ALIAS" || -z "$RELEASE_KEY_PASSWORD" ]]; then
            echo "::error::Configure the Android release signing secrets before publishing"
            exit 1
          fi
          keystore="$(mktemp "$RUNNER_TEMP/debloater.XXXXXX")"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="Debloater-v$VERSION.apk"
          "$build_tools/apksigner" sign --ks "$keystore" --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
            --out "$apk" app/build/outputs/apk/release/app-release-unsigned.apk
          "$build_tools/apksigner" verify --verbose "$apk"
          "$build_tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/debloater-apk.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/debloater-apk.txt"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: Debloater-release-apk
          path: Debloater-v${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Debloater-release-apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "Debloater-$TAG.apk" --verify-tag \
            --title "Debloater $TAG" --generate-notes
