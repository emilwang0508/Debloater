name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ColorOSDebloater-cloud-build.zip
      - .github/workflows/build-apk.yml
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Unpack source
        run: unzip -q ColorOSDebloater-cloud-build.zip -d android-project
      - name: Build and check the debug APK
        working-directory: android-project
        run: gradle --no-daemon assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOSDebloater-debug-apk
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
